server:
  port: 8080

spring:
  application:
    name: wolftrace

  datasource:
    url: jdbc:mysql://localhost:3306/wolftrace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: '041012'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

websocket:
  endpoint: /ws
  allowed-origins: "*"

logging:
  level:
    root: INFO
    com.linkpin.wolftrace: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/wolftrace.log
    max-size: 10MB
    max-history: 30

game:
  min-players: 4
  max-players: 12
  max-rounds: 3
  room-timeout: 300000
